# Two ways to run:
#   docker compose up -d                  infrastructure only (Postgres, Temporal); run the
#                                         API, worker and UI on the host for fast reloads
#   docker compose --profile app up -d    everything, including API, worker and UI
# Both need GOOGLE_API_KEY in .env.

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: live-company-check-backend
  profiles: ["app"]
  env_file: .env
  environment:
    # Inside the Compose network; these override the host-oriented values in .env.
    DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/company_check
    TEMPORAL_ADDRESS: temporal:7233
    CORS_ORIGINS: '["http://localhost:3000"]'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: company_check
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d company_check"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    # Temporal dev server backed by a SQLite file on a volume, so workflows
    # (paused / waiting checks) survive a restart of the Temporal container too.
    image: temporalio/temporal:1.9.1
    user: root  # the image's default user can't write to a fresh named volume
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporaldata:/data

  migrate:
    <<: *backend
    # Create/upgrade tables and load the companies (idempotent), then exit.
    command: ["sh", "-c", "alembic upgrade head && python -m company_check.seed"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "8000:8000"
    restart: unless-stopped  # also covers Temporal still starting up
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started

  worker:
    <<: *backend
    command: ["python", "-m", "company_check.worker.main"]
    restart: unless-stopped
    stop_grace_period: 15s  # lets a running agent save its progress on shutdown
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started

  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    profiles: ["app"]
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  temporaldata:
