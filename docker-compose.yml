# Infrastructure for local development. The API, worker and frontend run on the host
# during development (fast reloads); they are added as services for the full demo later.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: company_check
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d company_check"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    # Temporal dev server backed by a SQLite file on a volume, so workflows
    # (paused / waiting checks) survive a restart of the Temporal container too.
    image: temporalio/temporal:1.9.1
    user: root  # the image's default user can't write to a fresh named volume
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporaldata:/data

volumes:
  pgdata:
  temporaldata:
