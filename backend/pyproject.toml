[project]
name = "company-check"
version = "0.1.0"
description = "Live Company Check: AI-assisted company due diligence with a human reviewer"
authors = [
    { name = "Akshit Mehta", email = "akshitmehta0136@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2",
    "sse-starlette>=3.6.0",
    "temporalio>=1.35.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
